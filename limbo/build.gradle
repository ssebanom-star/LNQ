// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // AGP 8.x. The previous 4.1.1 pin also depended on jcenter(), which
        // was shut down in 2021 and no longer resolves at all.
        classpath 'com.android.tools.build:gradle:8.7.3'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

// Single source of truth for the app version: the VERSION file at the root.
// Bump it by 0.0.1 for every build handed out, so a reported problem can always
// be tied back to an exact APK.
ext.limboVersionName = file('VERSION').text.trim()
ext.limboVersionCode = {
    def (major, minor, patch) = ext.limboVersionName.tokenize('.')*.toInteger()
    major * 10000 + minor * 100 + patch
}()

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
}
